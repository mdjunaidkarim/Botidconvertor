<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER_PARSER // JUNAID KARIM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030305;
            color: #00ff66;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Matrix Canvas Background */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Background Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(255, 0, 51, 0.03);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Main Container */
        .terminal-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 51, 0.3);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 1rem;
            font-weight: bold;
            color: #ff0033;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 0, 51, 0.6);
        }

        .status-badge {
            font-size: 0.7rem;
            background: rgba(0, 255, 102, 0.1);
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 0.75rem;
            color: #ff3355;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* File Upload Area */
        .file-box {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed rgba(0, 255, 102, 0.4);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .file-box:hover {
            border-color: #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.2);
        }

        .file-box input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-text {
            font-size: 0.8rem;
            color: #888;
            word-break: break-all;
        }

        /* Buttons Style */
        .btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 0, 51, 0.1);
            border: 1px solid #ff0033;
            color: #ff0033;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 0, 51, 0.5);
        }

        .btn:hover:not(:disabled) {
            background: #ff0033;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
        }

        .btn-copy {
            background: rgba(0, 255, 102, 0.1);
            border-color: #00ff66;
            color: #00ff66;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
            padding: 14px;
        }

        .btn-copy:hover:not(:disabled) {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        .btn:disabled {
            border-color: #222;
            color: #444;
            background: transparent;
            text-shadow: none;
            cursor: not-allowed;
        }

        /* Stats Counter */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ff66;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #666;
            margin-top: 2px;
        }

        /* Output Box */
        .output-textarea {
            width: 100%;
            height: 100px;
            background: #000;
            border: 1px solid rgba(0, 255, 102, 0.2);
            color: #00ff66;
            padding: 10px;
            font-size: 0.75rem;
            resize: none;
            border-radius: 6px;
            outline: none;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* System Console Logs */
        .log-container {
            background: #000;
            border: 1px solid #111;
            padding: 8px 10px;
            height: 75px;
            overflow-y: auto;
            font-size: 0.68rem;
            color: #666;
            border-radius: 6px;
        }

        .log-item {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <div class="watermark">DEV: JUNAID KARIM</div>

    <div class="terminal-card">
        <div class="header">
            <div class="logo">⚡ CYBER_PARSER</div>
            <div class="status-badge">ONLINE</div>
        </div>

        <!-- Section 1: File Ingestion -->
        <div class="section-title">01 // SOURCE FILE</div>
        <div class="file-box">
            <span class="file-text" id="fileNameDisplay">[ TAP TO SELECT .TXT FILE ]</span>
            <input type="file" id="txtFile" accept=".txt">
        </div>

        <button class="btn" id="convertBtn">⚙️ CONVERT TARGET</button>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">TOTAL LOADS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="remainingCount" style="color: #ff0033;">0</div>
                <div class="stat-label">REMAINING</div>
            </div>
        </div>

        <!-- Section 2: Payload Execution -->
        <div class="section-title">02 // PAYLOAD CONTROL</div>
        <textarea class="output-textarea" id="outputBox" readonly placeholder="[ WAITING FOR CONVERSION... ]"></textarea>
        
        <button class="btn btn-copy" id="copyBtn" disabled>📋 COPY & SHIFT NEXT</button>

        <!-- Logs -->
        <div class="section-title" style="margin-top: 5px;">03 // TERMINAL LOGS</div>
        <div class="log-container" id="consoleLogs">
            <div class="log-item" style="color: #00ff66;">[SYSTEM] Core initialised by Junaid Karim...</div>
        </div>
    </div>

<script>
    // Matrix Background Animation
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = '0123456789ABCDEFGIJKLMNOPQRSTUVWXYZ';
    const fontSize = 10;
    const columns = canvas.width / fontSize;
    const drops = Array.from({ length: columns }, () => 1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = fontSize + 'px monospace';

        drops.forEach((y, i) => {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, y * fontSize);
            if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(drawMatrix, 33);

    // Application Logic
    let lines = [];
    let currentIndex = 0;

    function logMessage(msg, color = "#666") {
        const consoleLogs = document.getElementById('consoleLogs');
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        consoleLogs.innerHTML += `<div class="log-item" style="color: ${color};">[${time}] ${msg}</div>`;
        consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    document.getElementById('txtFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('fileNameDisplay').innerText = file.name;
            logMessage(`Target loaded: ${file.name}`, "#00ff66");
        }
    });

    // 1. CONVERT BUTTON
    document.getElementById('convertBtn').addEventListener('click', function() {
        const fileInput = document.getElementById('txtFile');
        const file = fileInput.files[0];

        if (!file) {
            logMessage(`ERROR: Target file missing!`, "#ff0033");
            alert('দয়া করে প্রথমে একটি টিএক্সটি ফাইল সিলেক্ট করুন!');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            lines = content.split(/\r?\n/).filter(line => line.trim() !== '');
            currentIndex = 0;

            if (lines.length > 0) {
                document.getElementById('copyBtn').disabled = false;
                document.getElementById('totalCount').innerText = lines.length;
                updateStats();
                showCurrentPayload();
                logMessage(`SUCCESS: Parsed ${lines.length} lines.`, "#00ff66");
            } else {
                logMessage(`WARNING: File is empty.`, "#ffcc00");
            }
        };
        reader.readAsText(file);
    });

    function getFormattedJSON(index) {
        if (index < lines.length) {
            const line = lines[index].trim();
            const parts = line.split(':');
            
            if (parts.length >= 2) {
                const uid = parts[0].trim();
                const pwd = parts.slice(1).join(':').trim();

                return JSON.stringify({
                    "guest_account_info": {
                        "com.garena.msdk.guest_password": pwd,
                        "com.garena.msdk.guest_uid": uid
                    }
                });
            }
        }
        return null;
    }

    function showCurrentPayload() {
        const json = getFormattedJSON(currentIndex);
        if (json) {
            document.getElementById('outputBox').value = json;
        } else {
            document.getElementById('outputBox').value = `[ERROR: INVALID FORMAT AT LINE ${currentIndex + 1}]`;
        }
    }

    // 2. COPY & NEXT BUTTON
    document.getElementById('copyBtn').addEventListener('click', function() {
        if (currentIndex < lines.length) {
            const jsonOutput = getFormattedJSON(currentIndex);
            
            if (jsonOutput) {
                navigator.clipboard.writeText(jsonOutput).then(() => {
                    logMessage(`COPIED & SHIFTED: [${currentIndex + 1}/${lines.length}]`, "#00ff66");
                    currentIndex++;
                    updateStats();

                    if (currentIndex < lines.length) {
                        showCurrentPayload();
                    } else {
                        document.getElementById('copyBtn').disabled = true;
                        document.getElementById('outputBox').value = '[ALL PAYLOADS PROCESSED]';
                        logMessage(`FINISHED: Task completed.`, "#00ff66");
                    }
                }).catch(err => {
                    logMessage(`ERROR: Clipboard write failed.`, "#ff0033");
                });
            } else {
                logMessage(`SKIPPED: Invalid line [${currentIndex + 1}]`, "#ffcc00");
                currentIndex++;
                updateStats();
                if (currentIndex < lines.length) showCurrentPayload();
            }
        }
    });

    function updateStats() {
        document.getElementById('remainingCount').innerText = lines.length - currentIndex;
    }
</script>

</body>
</html>
