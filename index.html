<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER_PARSER // JUNAID KARIM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030305;
            color: #00ff66;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Matrix Canvas Background */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Background Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(255, 0, 51, 0.03);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Main Container */
        .terminal-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 51, 0.3);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 1rem;
            font-weight: bold;
            color: #ff0033;
        }

        .status {
            font-size: 0.8rem;
            color: #00ff66;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #8a99ad;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #3d4f64;
            border-radius: 6px;
            padding: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(90deg, #ff0033, #b30023);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 0, 51, 0.4);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 51, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #556b82;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="watermark">CYBER_PARSER</div>
    <div class="terminal-card">
        <div class="header">
            <div class="logo">> SYNC_PARSER</div>
            <div class="status">
                <span class="status-dot"></span>
                <span>SYSTEM_ONLINE</span>
            </div>
        </div>
        <div class="input-group">
            <label for="input-link">Paste Link</label>
            <input type="text" id="input-link" placeholder="Enter URL here...">
        </div>
        <button>Parse</button>
        <div class="footer-text">Powered by JUNAID KARIM &copy; 2026</div>
    </div>
</body>
</html>
